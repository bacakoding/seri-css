<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Katalog Buku</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1 id="judul-utama">Katalog Buku</h1>
      <nav>
        <ul class="menu">

          <li><a href="#">Katalog</a></li>
          <li><a href="#">Tentang</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h2>Kategori</h2>

        <li>Novel</li>
        <li>Sejarah</li>
        <li>Puisi</li>
        <li>Anak-anak</li>

      <div class="kartu">

        <h2>Laut Bercerita</h2>
        <p>Novel tentang keluarga yang kehilangan.</p>
      </div>
      <div class="kartu unggulan">
        <span class="label">Pilihan Editor</span>
        <img class="sampul" src="sampul.svg" alt="Sampul buku Bumi Manusia">
        <h2>Bumi Manusia</h2>
        <p>Kisah awal pergerakan di Hindia Belanda.</p>
      </div>
    </main>
